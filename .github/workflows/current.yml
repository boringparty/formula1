
name: F1 Current Session Data

on:
  schedule:
    - cron: "*/15 * * * *" # Every 15 minutes
  workflow_dispatch:
    inputs:
      round_offset:
        description: 'Race offset for testing (0 = normal, -1 = previous, +1 = next)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: f1-current
  cancel-in-progress: false

jobs:
  update-current:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      # Preserve the previous JSON before scraping.
      - name: Save previous current.json
        run: |
          if [ -f current.json ]; then
            cp current.json /tmp/current-before.json
          else
            echo '{}' > /tmp/current-before.json
          fi

      - name: Build current session data
        env:
          F1_ROUND_OFFSET: ${{ github.event.inputs.round_offset || '0' }}
        run: python scripts/current.py

      # Compare actual data, ignoring the changing timestamp.
      - name: Check for data changes
        id: compare
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          old = json.loads(Path("/tmp/current-before.json").read_text())
          new = json.loads(Path("current.json").read_text())

          old.pop("updated_at_utc", None)
          new.pop("updated_at_utc", None)

          changed = old != new

          print(f"Data changed: {changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          PY

      # Always push to Sheets, even when JSON is unchanged.
      - name: Push data to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/push_to_sheets.py

      # Only commit when meaningful data has changed.
      - name: Commit current.json changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json
          git commit -m "Update current session data [skip ci]"
          git push

      # Only notify when changed data has been pushed successfully.
      - name: Notify Pushover - Data Updated
        if: success() && steps.compare.outputs.changed == 'true'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_API_TOKEN" ]; then
            echo "Pushover secrets missing. Skipping notification."
            exit 0
          fi

          curl -sS --fail \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=F1 Current Session" \
            --form-string "message=New F1 data posted successfully." \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json \
            || echo "Pushover notification failed. Continuing."
