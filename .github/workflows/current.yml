name: F1 Current Session Data

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      round_offset:
        description: 'Race offset for testing (0 = normal, -1 = previous, +1 = next)'
        required: false
        default: '0'
        type: string

      force_markdown:
        description: 'Regenerate markdown.md from the existing current.json without rerunning the race scraper'
        required: false
        default: false
        type: boolean

      force_sheets:
        description: 'Push existing current.json to Google Sheets even if the data has not changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: f1-current
  cancel-in-progress: false

jobs:
  update-current:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Save previous current.json
        run: |
          if [ -f current.json ]; then
            cp current.json /tmp/current-before.json
          else
            echo '{}' > /tmp/current-before.json
          fi

      - name: Build current session data
        if: inputs.force_markdown != true
        env:
          F1_ROUND_OFFSET: ${{ github.event.inputs.round_offset || '0' }}
          F1_FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/current.py

      - name: Check for data changes
        id: compare
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          old = json.loads(Path("/tmp/current-before.json").read_text())
          new = json.loads(Path("current.json").read_text())

          old.pop("updated_at_utc", None)
          new.pop("updated_at_utc", None)

          changed = old != new
          results_ready = new.get("race_results_published") is True

          print(f"Data changed: {changed}")
          print(f"Official race results ready: {results_ready}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"results_ready={'true' if results_ready else 'false'}\n")
          PY

      - name: Generate Markdown race report
        id: markdown
        if: inputs.force_markdown == true || (steps.compare.outputs.results_ready == 'true' && (steps.compare.outputs.changed == 'true' || hashFiles('markdown.md') == ''))
        run: python scripts/markdown.py

      - name: Push data to Google Sheets
        if: steps.compare.outputs.results_ready == 'true' && (steps.compare.outputs.changed == 'true' || inputs.force_sheets == true)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: python scripts/push_to_sheets.py

      - name: Commit current.json changes
        if: (steps.compare.outputs.results_ready == 'true' && (steps.compare.outputs.changed == 'true' || steps.markdown.outcome == 'success')) || inputs.force_markdown == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add current.json markdown.md

          if git diff --cached --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git commit -m "Update current session data [skip ci]"
          git push

      - name: Notify Pushover - Data Updated
        if: success() && steps.compare.outputs.changed == 'true' && steps.compare.outputs.results_ready == 'true'
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          if [ -z "$PUSHOVER_USER_KEY" ] || [ -z "$PUSHOVER_API_TOKEN" ]; then
            echo "Pushover secrets missing. Skipping notification."
            exit 0
          fi

          curl -sS --fail \
            --form-string "token=$PUSHOVER_API_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=F1 Current Session" \
            --form-string "message=Official race results posted and current.json updated." \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json \
            || echo "Pushover notification failed. Continuing."
