name: F1 Current Session Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-current
  cancel-in-progress: false

jobs:
  update-current:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run current session scraper
        run: python scripts/current.py

      - name: Commit current.json changes
        run: |
          if [ -z "$(git status --porcelain current.json)" ]; then
            echo "No changes to current.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json
          git commit -m "Update current.json session data [skip ci]"
          git push
