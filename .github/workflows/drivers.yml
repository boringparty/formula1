name: F1 Driver Directory

on:
  schedule:
    - cron: "0 4 * * 5" # Every Friday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-drivers
  cancel-in-progress: true

jobs:
  update-drivers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run driver directory script
        run: python scripts/drivers.py

      - name: Commit drivers.json changes
        run: |
          if [ -z "$(git status --porcelain drivers.json)" ]; then
            echo "No changes to drivers.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers.json
          git commit -m "Update cumulative drivers.json directory [skip ci]"
          git push
