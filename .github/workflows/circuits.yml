name: F1 Circuits

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-circuits
  cancel-in-progress: true

jobs:
  build-circuits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run circuit setup script
        run: python scripts/circuits.py

      - name: Commit circuits.json changes
        run: |
          if [ -z "$(git status --porcelain circuits.json)" ]; then
            echo "No changes to circuits.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add circuits.json
          git commit -m "Update circuits.json setup [skip ci]"
          git push
