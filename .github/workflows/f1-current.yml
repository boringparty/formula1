name: F1 Current Session Updater

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force-fetch the latest active session now"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-current-json
  cancel-in-progress: false

jobs:
  update-current:
  # Optional: Restrict cron execution to active racing months (e.g., March to December) to save runner minutes
  # if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.date in ['3', '4', '5', '6', '7', '8', '9', '10', '11'])
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      F1_FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run current session scraper
        run: python scripts/scrape_current.py

      - name: Commit current.json changes
        run: |
          if [ -z "$(git status --porcelain current.json)" ]; then
            echo "No changes to current.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json
          git commit -m "Update active race session data [skip ci]"
          git push
