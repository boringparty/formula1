name: F1 Season Archive Builder

on:
  schedule:
    # Runs weekly (e.g., Mondays at 02:00 UTC, safely after race weekends conclude)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild full season archive now"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-season-json
  cancel-in-progress: false

jobs:
  update-season:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run season archive builder
        run: python scripts/scrape_season.py

      - name: Commit season.json changes
        run: |
          if [ -z "$(git status --porcelain season.json)" ]; then
            echo "No changes to season.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season.json
          git commit -m "Update full season schedule and track metrics archive [skip ci]"
          git push
