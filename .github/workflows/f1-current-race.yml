name: F1 current race JSON

on:
  schedule:
    # UTC schedule; calendar logic prevents F1 scraping outside start+90m to start+150m.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force-fetch the latest completed Grand Prix now (for testing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: f1-current-race-json
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      F1_USERNAME: ${{ secrets.F1_USERNAME }}
      F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
      FASTF1_AUTH_METHOD: password
      F1_FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape official results and FastF1 timing
        run: python scrape_current_race.py

      - name: Commit generated JSON and state
        run: |
          if [ -z "$(git status --porcelain -- '*.json')" ]; then
            echo "No JSON files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json'
          git commit -m "Update F1 race timing JSON"
          git push
