name: F1 current race JSON

on:
  schedule:
    # GitHub Actions cron is UTC. The script checks the calendar and makes
    # zero Formula1.com requests unless the race is in its post-race window.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f1-current-race-json
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape only during the current race's post-race window
        run: python scrape_current_race.py

      - name: Commit updated JSON and state
        run: |
          if [ -z "$(git status --porcelain -- current-race.json .f1-scraper-state.json)" ]; then
            echo "No files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-race.json .f1-scraper-state.json
          git commit -m "Update current F1 race JSON"
          git push
